version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Eclipse Mosquitto MQTT Broker
  # -------------------------------------------------------------
  mosquitto:
    build:
      context: ./mosquitto
      dockerfile: Dockerfile
    container_name: arceus_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - arceus_net
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -u '' -P '' || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------
  # 2. Coordinator Daemon (Telemetry Ingestion & Anomaly Detector)
  # -------------------------------------------------------------
  coordinator-collector:
    build:
      context: ./coordinator
      dockerfile: Dockerfile
    container_name: arceus_collector
    restart: unless-stopped
    command: ["python", "main.py"]
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - ARCEUS_DATA_DIR=/app/data
    volumes:
      - arceus_data:/app/data
    depends_on:
      - mosquitto
    networks:
      - arceus_net

  # -------------------------------------------------------------
  # 3. Streamlit Operations Dashboard & Federated Learning UI
  # -------------------------------------------------------------
  coordinator-dashboard:
    build:
      context: ./coordinator
      dockerfile: Dockerfile
    container_name: arceus_dashboard
    restart: unless-stopped
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - ARCEUS_DATA_DIR=/app/data
    ports:
      - "8501:8501"
    volumes:
      - arceus_data:/app/data
    depends_on:
      - mosquitto
    networks:
      - arceus_net

networks:
  arceus_net:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
  arceus_data:
