; PlatformIO Project Configuration for ARCEUS GRID Node
; Compatible with ESP32 DevKit V1

[platformio]
default_envs = station_a

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit INA219@^1.2.3
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4

[env:station_a]
build_flags =
    -D STATION_ID_CHAR='A'
    -D STATION_NAME=\"station_a\"

[env:station_b]
build_flags =
    -D STATION_ID_CHAR='B'
    -D STATION_NAME=\"station_b\"

[env:stage1_didactic_test]
src_filter = +<../stage1_test/src/*> -<arceus_node/*>
