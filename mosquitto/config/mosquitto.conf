# Mosquitto MQTT Broker Configuration for ARCEUS GRID
# Port for standard MQTT
listener 1883
allow_anonymous true

# Port for WebSockets (for web dashboards if needed)
listener 9001
protocol websockets

# Persistence configuration
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
